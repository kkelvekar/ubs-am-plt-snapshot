# Porting note: replace only these four image values with approved registry images.
variables:
  CI_BUILD_IMAGE: "mcr.microsoft.com/dotnet/sdk:10.0"
  CI_REGRESSION_IMAGE: "mcr.microsoft.com/dotnet/sdk:10.0"
  CI_SQLSERVER_IMAGE: "mcr.microsoft.com/mssql/server:2022-latest"
  CI_AZURITE_IMAGE: "mcr.microsoft.com/azure-storage/azurite"

  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  BUILD_CONFIGURATION: "Release"
  REPORTGENERATOR_VERSION: "5.5.3"

default:
  image:
    name: "$CI_BUILD_IMAGE"

stages:
  - build
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/
    - .dotnet-tools/

build:
  stage: build
  script:
    - dotnet restore UBS.AM.PLT.Snapshot.sln
    - dotnet build UBS.AM.PLT.Snapshot.sln --configuration "$BUILD_CONFIGURATION" --no-restore

unit_tests:
  stage: test
  script:
    - dotnet test tests/UBS.AM.PLT.Snapshot.UnitTests/UBS.AM.PLT.Snapshot.UnitTests.csproj --configuration "$BUILD_CONFIGURATION"

regression_tests:
  stage: test
  image:
    name: "$CI_REGRESSION_IMAGE"
  services:
    - name: "$CI_SQLSERVER_IMAGE"
      alias: sqlserver
    - name: "$CI_AZURITE_IMAGE"
      alias: azurite
  variables:
    DOTNET_ENVIRONMENT: "CI"
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: "$SQLSERVER_SA_PASSWORD"
    Database__ConnectionString: "Server=sqlserver,1433;Database=UbsAdvantageSnapshots;User Id=sa;Password=$SQLSERVER_SA_PASSWORD;TrustServerCertificate=True;Encrypt=False"
    BlobStorage__ServiceUri: ""
    BlobStorage__ContainerName: "ubsadvsnapshots"
  before_script:
    - if [ -f /ubs/ubs-certs.sh ]; then /bin/sh /ubs/ubs-certs.sh >/dev/null 2>&1; fi
  script:
    - |
      required_vars="SQLSERVER_SA_PASSWORD BlobStorage__ConnectionString"
      for name in $required_vars; do
        eval "value=\${$name:-}"
        if [ -z "$value" ]; then
          echo "Required GitLab CI variable '$name' is not set."
          exit 1
        fi
      done
    - |
      if [ ! -x "$CI_PROJECT_DIR/.dotnet-tools/reportgenerator" ]; then
        dotnet tool install --tool-path "$CI_PROJECT_DIR/.dotnet-tools" dotnet-reportgenerator-globaltool --version "$REPORTGENERATOR_VERSION"
      fi
    - |
      set +e
      dotnet test "tests/UBS.AM.PLT.Snapshot.IntegrationTests/UBS.AM.PLT.Snapshot.IntegrationTests.csproj" --configuration "$BUILD_CONFIGURATION" --collect:"XPlat Code Coverage" --logger:"junit;LogFilePath=$CI_PROJECT_DIR/TestResults/regression-test-results.xml;MethodFormat=Class;FailureBodyFormat=Verbose" --results-directory "$CI_PROJECT_DIR/TestResults"
      test_exit_code=$?
      set -e
      "$CI_PROJECT_DIR/.dotnet-tools/reportgenerator" -reports:"$CI_PROJECT_DIR/TestResults/**/coverage.cobertura.xml" -targetdir:"$CI_PROJECT_DIR/coverage-report" -reporttypes:"Html;HtmlSummary;Cobertura;TextSummary;Badges" -title:"Snapshot Writer Regression Coverage"
      cat "$CI_PROJECT_DIR/coverage-report/Summary.txt"
      if [ ! -f "$CI_PROJECT_DIR/test-reports/test-report-latest.html" ]; then
        echo "BDD HTML report was not generated. Copy Support/CiTestReportWriter.cs and the updated Support/ReqnrollHooks.cs into the integration-test project." >&2
        exit 1
      fi
      exit "$test_exit_code"
  artifacts:
    when: always
    expire_in: never
    paths:
      - TestResults/
      - coverage-report/
      - test-reports/
    reports:
      junit: TestResults/regression-test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-report/Cobertura.xml
